[project]
name = "adaptive-deterministic-rag"
version = "0.2.0"
description = "Bounded, observable, multi-tenant retrieval-augmented generation backend"
readme = "README.md"
requires-python = "==3.13.9"
license = { text = "MIT" }
authors = [{ name = "Sampath" }]
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "openai>=1.100",
  "pydantic-settings>=2.10",
  "pymongo>=4.13",
  "pyyaml>=6.0.2",
  "qdrant-client>=1.15",
  "tiktoken==0.14.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--disable-warnings"]

[tool.coverage.run]
branch = true
source = ["handlers", "services", "utils"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
